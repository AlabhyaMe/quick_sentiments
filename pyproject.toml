# pyproject.toml 
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quick-sentiments"
version = "0.4.5" # tensorflow enters !
authors = [
  { name="Alabhya Dahal", email="alabhya.dahal@gmail.com" },
]
description = "Sentiment Analysis pipeline"
readme = "README.md" # <--- Ensure this points to your README.md
license = { text = "MIT License" }
urls = { "Homepage" = "https://github.com/AlabhyaMe/Sentiments-Analysis" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic"
]
requires-python = ">=3.10, <3.15"
dependencies = [
    # Core Data Libraries (Uncapped for performance)
    "numpy>=1.23.0",          # Allows NumPy 2.0 if other libs support it
    "pandas>=2.0.0",          # Safe: Your code uses standard DataFrame features
    "polars>=0.20.0",         # Safe: We verified 'from_pandas' and 'to_list' work
    "scipy>=1.9.0",

    # Machine Learning & NLP
    "scikit-learn>=1.3.0",    # robust to NumPy changes
    "xgboost>=2.0.0",         # Major speed improvements in 2.0+
    "gensim>=4.3.3",          # meaningful fixes for NumPy compatibility
    "nltk==3.8.1",            # Keep pinned (very stable, rarely needs updates)
    "spacy>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=22.0",
    "twine",
    "build",
]
hf = [
    "sentence-transformers>=2.2.0" # <--- NEW: Optional Hugging Face installation
]

dl = [
    "tensorflow>=2.13.0",     # 2.13+ is generally very stable with newer Python versions
    "scikeras>=0.12.0",       # Required for the GridSearchCV wrapper we built
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"quick_sentiments" = ["*.json", "*.pkl"]